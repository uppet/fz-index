name: build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        emacs: ['28.2', '29.4', '30.2']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          install: make mingw-w64-x86_64-gcc
      # purcell/setup-emacs does not support Windows (its install.sh
      # is mangled by Git bash path conversion); use the Windows
      # fork there instead.
      - uses: purcell/setup-emacs@master
        if: runner.os != 'Windows'
        with:
          version: ${{ matrix.emacs }}
      - uses: jcs090218/setup-emacs-windows@master
        if: runner.os == 'Windows'
        with:
          version: ${{ matrix.emacs }}
      - name: Build the module (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make fz-index.dll
      - name: Build the module
        if: runner.os != 'Windows'
        run: make
      - name: Byte-compile and parens check
        shell: bash
        run: >
          emacs -Q --batch
          --eval '(with-current-buffer (find-file "fz-index.el") (check-parens))'
          --eval '(byte-compile-file "fz-index.el")'
      # The linters are OS-independent; run them once on Linux instead
      # of nine times across the matrix.
      - name: checkdoc
        if: runner.os == 'Linux'
        run: |
          set -e
          emacs -Q --batch --eval '(checkdoc-file "fz-index.el")' \
            > /tmp/checkdoc.log 2>&1 || true
          if grep -q "fz-index.el:" /tmp/checkdoc.log; then
            cat /tmp/checkdoc.log
            exit 1
          fi
      - name: package-lint
        if: runner.os == 'Linux'
        run: |
          set -e
          # package-lint needs its bundled data/ directory, so a
          # single-file download does not work; clone the repo.
          git clone --depth 1 https://github.com/purcell/package-lint \
            /tmp/package-lint
          emacs -Q --batch -L /tmp/package-lint \
            -f package-lint-batch-and-exit fz-index.el
      - name: Run tests
        shell: bash
        run: |
          set -e
          emacs -Q --batch -L . -l fz-index-tests.el -f ert-run-tests-batch-and-exit
          for t in test-m3.el test-m4.el test-open.el test-ui-fix.el \
                   test-ui-flow.el test-multiword.el test-persist.el \
                   test-refresh.el test-symlink.el test-root.el \
                   test-highlight.el test-completion-table.el \
                   test-module-install.el test-fuzz.el; do
            echo "== $t"
            emacs -Q --batch -L . -l "$t"
          done
      - name: Tag matches Version header
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          grep -q "^;; Version: $tag\$" fz-index.el || {
            echo "::error::tag v$tag does not match the Version header in fz-index.el"
            exit 1
          }

  asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system Emacs
        # The nix-based setup-emacs Emacs cannot use the system
        # libasan (its loader does not search system paths); the apt
        # Emacs shares the toolchain with the sanitizer runtime.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq emacs-nox clang
      - name: Static analysis (clang --analyze)
        run: |
          set -e
          clang --analyze -std=c99 -Wall -Wextra -o /dev/null fz-index.c \
            > /tmp/clang-analyze.log 2>&1 || true
          if grep -qE "warning:|error:" /tmp/clang-analyze.log; then
            cat /tmp/clang-analyze.log
            exit 1
          fi
      - name: Build with ASan+UBSan
        run: >
          gcc -O1 -g -fsanitize=address,undefined
          -fno-omit-frame-pointer -std=c99 -fPIC -shared
          -o fz-index.so fz-index.c -lpthread
      - name: Scanner ASan stress (symlink loop + cancel)
        run: |
          gcc -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
              -std=c99 fz-asan-stress.c -o fz-asan-stress -lpthread
          ASAN_OPTIONS=detect_leaks=0 ./fz-asan-stress
      - name: Byte-compile the UI
        run: emacs -Q --batch --eval '(byte-compile-file "fz-index.el")'
      - name: Run tests under ASan
        run: |
          set -e
          export LD_PRELOAD="$(gcc -print-file-name=libasan.so) $(gcc -print-file-name=libubsan.so)"
          export ASAN_OPTIONS=detect_leaks=0
          emacs -Q --batch -L . -l fz-index-tests.el -f ert-run-tests-batch-and-exit
          for t in test-m3.el test-m4.el test-open.el test-ui-fix.el \
                   test-ui-flow.el test-multiword.el test-persist.el \
                   test-refresh.el test-symlink.el test-root.el \
                   test-highlight.el test-completion-table.el \
                   test-module-install.el test-fuzz.el; do
            echo "== $t"
            emacs -Q --batch -L . -l "$t"
          done

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          install: make mingw-w64-x86_64-gcc
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make fz-index.dll
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: make
      - name: Build (macOS, arm64 + x86_64)
        if: runner.os == 'macOS'
        run: |
          # Cross-compile both arches on the arm64 runner: the Intel
          # runner pool (macos-13) is being retired and queues forever.
          make CFLAGS="-O2 -Wall -Wextra -std=c99 -fPIC -arch arm64"
          mv fz-index.dylib fz-index-aarch64-macos.dylib
          make clean
          make CFLAGS="-O2 -Wall -Wextra -std=c99 -fPIC -arch x86_64"
          mv fz-index.dylib fz-index-x86_64-macos.dylib
      - name: Stage assets
        shell: bash
        run: |
          shopt -s nullglob
          case "${{ runner.os }}" in
            Linux)
              case "$(uname -m)" in
                x86_64)  cp fz-index.so fz-index-x86_64-linux-gnu.so ;;
                aarch64) cp fz-index.so fz-index-aarch64-linux-gnu.so ;;
                *) echo "unexpected arch $(uname -m)"; exit 1 ;;
              esac ;;
            Windows) cp fz-index.dll fz-index-x86_64-windows.dll ;;
            macOS)   : ;;  # named by the build step already
          esac
          assets=(fz-index-x86_64-* fz-index-aarch64-*)
          [ ${#assets[@]} -gt 0 ] || { echo "no staged assets"; exit 1; }
          ls -l "${assets[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: module-${{ matrix.os }}
          path: |
            fz-index-x86_64-*
            fz-index-aarch64-*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: module-*
          merge-multiple: true
      - name: Checksums
        run: sha256sum fz-index-* > checksums.txt && cat checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            fz-index-*
            checksums.txt
